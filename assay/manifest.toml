# ── 规则三：分歧（v0.4 §7） ───────────────────────────────────────────────────
# 真实摩擦：两个实验台把**同一个窗口不变量**各写了一遍，两种语言、两种范围语义，
# 而没有任何东西检查它们说的是不是同一件事。漂移就藏在那里。

[[claim]]
id = "C-009"
text = "同一条声明上出现分歧时，绿的那条不得被读成「该声明成立」"
rejected_by = "引擎吞掉分歧：同一个不变量在两处各写一遍、互不知情，而绿的那条被当成结论。这是漂移最好的藏身处"
capability = "self-test"
strength_required = 5
origin = "assay-protocol"
scope = "unbounded"
trust_assumption = "引擎只能报出「清单里已有的绑定」上的分歧。它不知道两个检查是否在判同一件事——那是人的判断。承担者：清单作者"

[[check]]
id = "S-09"
claims = ["C-009"]
capability = "self-test"
strength = 5
scope = "unbounded"
command = "pwsh -NoProfile -File assay\\selfcheck\\S-09-contested-is-reported.ps1"
red_command = "pwsh -NoProfile -File assay\\selfcheck\\inject\\R-09.ps1"
