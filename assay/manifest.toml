capability = "structural"
strength_required = 5
scope = "unbounded"
obligations = ["O-048"]
trust_assumption = "doctor 只查首词能否在 PATH 或仓库内解析到，**不执行**任何被声明的命令。因此它证不了'命令能跑通'，只证得了'命令找得到'。承担者：清单作者（首次 run 时确认）"

