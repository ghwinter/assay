# 四道门空转了两个引擎版本，状态板一路全绿。
#
# 两半判据各自对应一次实测：
#   ① 预算：没有上限的规则文件只会单向变长（"加一条规则"的收益当场可见，
#      "上下文变贵"的成本要等会话开始漂移才显形）；且靠自觉的预算等于没有预算。
#   ② 命令头：机器相关的具体命令是**会腐化的声明**，它属于按需加载的 RUNBOOK.md。

