# ── 规则四：入口（D-033） ─────────────────────────────────────────────────────
# 买它的摩擦（措辞尽量贴近实测）：
#   仓里有协议、引擎、账本工具与工作流文档，**没有任何一处能让 agent 问出
#   "现在状态如何、下一步做什么"**；而且"声明的命令能不能跑"这件事无人检查。
#   本机实测：PATH 上的 `python` 是 Microsoft Store 的 App Execution Alias 占位符，
#   且没有解释器装 PyYAML（七个账本工具都 import yaml）——
#   于是 pre-commit 的四道门**一次都没真正执行过**，而 `assay check` 仍然全绿。
#   绿的是清单，不是工作。
#
# `doctor` 与 `check` 判两件不同的事，刻意分开：
#   check  —— 清单自身是否自洽（门禁，红即阻断）
#   doctor —— 工作还能不能继续（就绪度；不跑任何检查）
#   合并会让"清单有错"与"本机跑不起来"混成一个红灯，而处置完全不同。

