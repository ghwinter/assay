id: D-020
status: accepted
question: 是否收编《推理方法论》手稿（2026-08/09 六文件，thinking/methodology/）作为 thinking/ 层的理论基座？
goal: [G-001, G-002, G-003]
alternatives: [收编+三步合并, 仅作参考文献挂靠, 不收编]
choice: 收编（手册存于 thinking/methodology/，随 git 锁定），三步合并按优先级分批执行——注意：原拟合并项中两项已被并行工作提前兑现（BS-010 硬化=D-016 桥检查器；执行门=thinking/execution_gates.md 且已被 D-017 引用），故合并计划相应收窄
rationale:
  - text: 独立收敛证据——手册四标签（定义/命题/证据/声明）对应宪法硬/软三分但更细（定义独立成类，且 T1 从 Gödel/Tarski/Rice 导出"声明层是结构必然"，我方仅以签名责任作断言）；T1 验证塔对应 BS-012/M-010；discipline §4 AI 规则（产物表=唯一跨轮状态、双轨标注、链长预算）对应 AGENTS.md 但成文早一个月。两套系统独立到达同一结构 = 互相验证
    anchor: thinking/methodology/root.html §1–2
  - text: 手册严格领先、账本仍缺的三学科——SG5 溯因隔离（猜想状态沿支撑链传播，承重边审计——账本 schema 无此字段）；SG9 干预纪律（干预-效果对账、结构性/运行性矛盾分账、检测器钝化扫描——D-015 黄金用例是种子但无常设重放纪律）；分歧定位规则（数值/口径/判定/语义四类分歧定位不同层——实验 C 五分类的先行形式化）
    anchor: thinking/methodology/root.html §3–4
  - text: 合并次序（收窄版）——(1) 立即：discipline §4 AI 附加规则并入 AGENTS.md（未知标注、双轨标注、链长预算、产物表=跨轮状态）；(2) 短期：SG5 猜想状态字段进账本 schema（义务/声明分 猜想|已检 两态），SG9 检测器钝化重放设为 experiments 常设议程（D-015 黄金用例即重放对象）；(3) 中期：宪法三分法修订为四标签（T1 导出声明必然性），完备性探询设为 thinking/ 常设议程（root §6 模式）
    anchor: thinking/methodology/discipline.html §4
  - text: 边界条款照单全收——范畴论转写停留类比级（foundations-math §5.1 的 Yoneda/伴随/普适性质判定表即此纪律的示范，亦约束本账本此前一切 CT 类比）；互为第二通道：账本机器是手册的独立校验通道，手册是账本的理论审计通道（T2.1）
    anchor: thinking/methodology/foundations-math.html §4–5
  - text: 裁决记录——操作者 2026-10-07 批示"都可以做，开始执行"。同日体检兑现第(2)步的一半：SG9 钝化重放第一次实弹命中（lint 的 9 条永久 WARN，D-023 修复）；手册条目引用自此按 thinking/glossary.md 命名空间读法（SG/HM/AT 前缀），本文 G5/G9 字样按此勘误为 SG5/SG9
    anchor: owner=human（操作者批量裁决 2026-10-07）
