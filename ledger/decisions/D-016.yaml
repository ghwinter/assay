id: D-016
status: accepted
question: 模型↔代码一致性靠什么维持？（BS-010 承认的"评审+快照"薄墙如何硬化）
goal: [G-001, G-002]
alternatives: [机械对账检查器（桥表+符号核对）, 全面精化证明（TLA+↔Verus↔Rust 三层）, 维持评审+断点快照]
choice: 机械对账检查器——ledger/bridge.yaml 登记模型常量/被检性质/语义点三张映射表，
