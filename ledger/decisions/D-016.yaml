rationale:
  - text: 全面精化证明是正解但成本超出本阶段（TLA+↔代码的自动精化尚无成熟工具链，VerusSync 精化只在 Rust 侧内部）；对账检查器以 lint 档成本堵住"模型改名实现漂移"这类高频事故
    anchor: thinking/blind_spots.md BS-010（本仓库实例：O-023 断点快照只是雏形）
  - text: 桥表强制"cfg 检查的每条性质必须有人认领"——模型检查了却无人声明对应实现什么承诺，是 BS-010 最隐蔽的形态，B2 规则直接封死
    anchor: CONSTITUTION.md 中间地带非法（检查了但没锚点=无主证据）
  - text: 3/8 语义点（关闭/唤醒时序）verus 侧为 null——覆盖面诚实登记而非假装全覆盖，这本身就是对 BS-010 的日常提醒
