id: D-033
status: draft
question: >-
  仓里已经有协议（PROTOCOL）、引擎（Rust 哑执行器）、账本工具（7 个 Python 脚本 + 四合一门）
  和一份工作流文档，但**没有任何一处能让 agent 用一条命令问出"现在状态如何、下一步做什么"**；
  同时"声明的命令能不能跑"这件事无人检查——本机实测 `python` 是 Microsoft Store 的 App
  Execution Alias 占位符、且无解释器装 PyYAML，于是 pre-commit 的四道门一次都没真正执行过，
  而 `assay check` 仍然全绿。缺的是入口（诊断 + 导览），还是又一批检查？
goal: [G-005, G-007]
alternatives:
  - 再加文档：把 AGENTS.md 写得更详细，让 agent 自己照着做
  - 把入口做进 Python 工具链（新增 tools/status.py，与 ledger_lint 同层）
  - 把入口做进引擎（新增 doctor / next 两个只读子命令），Python 侧只留既有工具
  - 做 MCP server / 常驻服务，让 agent 通过协议调用
choice: >-
  入口做进引擎：新增只读子命令 `doctor`（就绪度诊断）与 `next`（有序动作表）。
  账本工具保持原样，只补一个启动器与自检解释器解析。
rationale:
  - text: >-
      反对"再加文档"：文档是**声明**，不是**锚点**。AGENTS.md 写了 `python tools/gate.py`，
      本机跑不了；把文档写得更长不会让命令变得可解析。这正是 BS-011（无锚断言）的形态——
      流畅的文本填满了未知。实测代价：四道门一次未执行，而 `assay check` 全绿。
    anchor: thinking/blind_spots.md
  - text: >-
      反对"做进 Python 工具链"：入口自身的可运行性不该依赖它要诊断的那条链路。
      `doctor` 的第一项职责就是判断 Python 侧能不能跑；让它用 Python 写，
      等于让被诊断者给自己发健康证明（BS-012 自审不可见偏差的同构）。
      引擎是零依赖 Rust 单文件二进制，天然是这条职责的正确落点。
    anchor: engine/VENDOR.md
  - text: >-
      反对"MCP / 常驻服务"：本仓的既定边界是"不建服务端、不建中心模型"（README 边界一节）。
      服务端会引入生命周期、并发与部署面，与"引擎可丢弃，产物不可丢弃"直接冲突。
      只读子命令的接入成本是 0，删除成本也是 0。
    anchor: README.md
  - text: >-
      `doctor` 与 `check` 判的是两件不同的事，必须分开：`check` 判**清单自身**是否自洽（门禁，
      红即阻断）；`doctor` 判**工作还能不能继续**。把两者并进 `check` 会让"清单有错"
      与"本机跑不起来"混成一个红灯，而这两者的处置完全不同（改清单 vs 装工具）。
    anchor: PROTOCOL.md
  - text: >-
      `next` 的失效判据刻意**不用整份清单指纹**：那会把"改了一个注释"与"改了检查命令"
      判成同一件事，结果是全部证据天天报陈旧，人开始无视它。
      正确的粒度是这条检查自己的定义（命令 / 档 / 范围 / 绑定的声明），
      这些字段证据信封里本来就有（协议 §2.4 的 checker 段）——这是"再验证规则"的最小可用形态。
    anchor: protocol/schemas/evidence-v1.schema.json
  - text: >-
      engine 只加模块、不加依赖：`readiness.rs` 只用 std + 既有的 toml/serde_json。
      环境接触点只有一个——"声明命令的首词能否解析到"，且**只查 PATH，不执行**。
      引擎不需要知道 `python` 是什么，只需要知道"首词解析不到东西"。
    anchor: engine/VENDOR.md
obligations:
  - id: O-048
    bs_guard: [BS-011]
    desc: >-
      `assay doctor` 报出清单里声明的命令首词解析不到，并**点名**是哪个检查的哪个字段；
      解析得到的命令不得误报（反向用例与正向用例同时成立）
    origin: tool
    checker:
      type: lint
      target: assay/selfcheck/S-10-unresolvable-command-is-red.ps1
      ref: pwsh -NoProfile -File assay/selfcheck/S-10-unresolvable-command-is-red.ps1
  - id: O-049
    bs_guard: [BS-013]
    desc: >-
      `assay next` 报出"证据与当前检查定义不符"并给出**具体**原因（命令已改/档已改/范围已改/
      绑定已改/最近非 pass/旧格式），且定义未变时**不得**因清单文本变化而误报
    origin: tool
    checker:
      type: lint
      target: assay/selfcheck/S-11-next-detects-definition-drift.ps1
      ref: pwsh -NoProfile -File assay/selfcheck/S-11-next-detects-definition-drift.ps1
  - id: O-050
    bs_guard: []
    bs_note: >-
      判例库尚无对应条目。本条防的是"**作用域由本机文件系统决定，而不是由 git 决定**"：
      L1 直接 glob `tools/**/*.py`，不看 .gitignore，于是本地虚拟环境里的 site-packages
      被认成无主产物；后果不是噪音，而是**同一份提交在两台机器上可以一红一绿**。
      形态上与 BS-C1（空作用域通过）互补——那条挡"零个对象"，这条挡"对象集随机器漂移"。
      候选升级为 BS-014，需走元认知库的入册裁决。
    desc: >-
      L1 的产物全集由 git 定义（.gitignore 说了算）：未跟踪且未忽略的新文件仍在作用域内，
      命中忽略规则的文件移出作用域
    origin: tool
    checker:
      type: lint
      target: assay/selfcheck/S-12-l1-scope-follows-git.ps1
      ref: pwsh -NoProfile -File assay/selfcheck/S-12-l1-scope-follows-git.ps1
  - id: O-051
    bs_guard: [BS-012]
    desc: >-
      唯一入口 `assay`（tools/assay-cli.ps1 + assay.cmd）解析出真正可运行的 Python 侧并透传
      账本工具；`assay bootstrap` 打印实际使用的解释器版本与 PyYAML 版本
    origin: tool
    checker:
      type: manual
      target: tools/assay-cli.ps1
      ref: assay bootstrap（人工核对打印的解释器与 yaml 版本）+ assay gate 全绿
assumptions:
  - text: >-
      本机 PATH 上的 `python` 可能是 Microsoft Store 的 App Execution Alias 占位符
      （0 字节重解析点）：`Get-Command python` 有结果，但执行即失败。
    invalidation: 在一台 `python` 指向真实解释器且装有 PyYAML 的机器上，本前提不成立；
      此时启动器会直接命中 config 裸名解析，行为不变（更快）。
  - text: >-
      uv 可用（或至少存在一个带 PyYAML 的解释器）时，启动器可以自动准备 tools/.venv。
    invalidation: 既无 uv、又无任何带 PyYAML 的解释器时，启动器必须报错退出 127，
      而不是静默降级——账本侧不可用必须显式可见。
rejected_alternatives: >-
  见 alternatives 与 rationale 逐条对应：加文档（把声明当锚点）、做进 Python（自审）、
  MCP/服务端（越过"不建服务端"的既定边界）。
waivers: []
