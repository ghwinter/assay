name: Assay CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check Assay formatting
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check
      - name: Check example formatting
        run: cargo fmt --manifest-path examples/rust-service/Cargo.toml -- --check
      - name: Check parallel example formatting
        run: cargo fmt --manifest-path examples/parallel-histogram/Cargo.toml -- --check
      - name: Test Assay CLI
        run: cargo test --locked --manifest-path engine/Cargo.toml
      - name: Lint Assay CLI
        run: cargo clippy --locked --manifest-path engine/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust pilot
        run: cargo test --locked --manifest-path pilot-rs/Cargo.toml
      - name: Test Rust example
        run: cargo test --locked --manifest-path examples/rust-service/Cargo.toml
      - name: Test parallel Rust example
        run: cargo test --locked --manifest-path examples/parallel-histogram/Cargo.toml
      - name: Check bounded pipeline protocol model
        if: runner.os == 'Linux'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run bounded pipeline protocol model
        if: runner.os == 'Linux'
        run: python examples/parallel-histogram/tla/check.py
      - name: Lint Rust example
        run: cargo clippy --locked --manifest-path examples/rust-service/Cargo.toml --all-targets -- -D warnings
      - name: Lint parallel Rust example
        run: cargo clippy --locked --manifest-path examples/parallel-histogram/Cargo.toml --all-targets -- -D warnings
      - name: Check Assay manifest
        run: cargo run --locked --quiet --manifest-path engine/Cargo.toml -- check --root .
      - name: Check example manifest
        run: cargo run --locked --quiet --manifest-path engine/Cargo.toml -- check --root examples/rust-service
      - name: Check parallel example manifest
        run: cargo run --locked --quiet --manifest-path engine/Cargo.toml -- check --root examples/parallel-histogram
      - name: Regenerate Assay map
        run: cargo run --locked --quiet --manifest-path engine/Cargo.toml -- map --root .
      - name: Regenerate example map
        run: cargo run --locked --quiet --manifest-path engine/Cargo.toml -- map --root examples/rust-service
      - name: Regenerate parallel example map
        run: cargo run --locked --quiet --manifest-path engine/Cargo.toml -- map --root examples/parallel-histogram
      - name: Check generated maps are current
        run: git diff --exit-code -- assay/MAP.md examples/rust-service/assay/MAP.md examples/parallel-histogram/assay/MAP.md

  ledger:
    name: Spec Ledger gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ledger parser dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Run repository gate
        run: python tools/gate.py
      - name: Re-run executable ledger obligations
        run: |
          python tools/ledger_check.py O-033
          python tools/ledger_check.py O-036
          python tools/ledger_check.py O-037
          python tools/ledger_check.py O-040
          python tools/ledger_check.py O-041
          python tools/ledger_check.py O-042
          python tools/ledger_check.py O-043
          python tools/ledger_check.py O-044
          python tools/ledger_check.py O-045
          python tools/ledger_check.py O-046
          python tools/ledger_check.py O-047

  example-workflow:
    name: End-to-end example
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install example ledger dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate initialized project workflow
        run: pwsh -NoProfile -File examples/validate-workflow.ps1
